packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@whiskeysockets/baileys': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# baileys depends on libsignal, resolved via a git repository as a sub-dependency;
# pnpm 11 blocks non-registry sub-dependencies by default as a supply-chain safeguard.
blockExoticSubdeps: false
